<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Portal Principal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%230c21a4%22/%3E%3Cpath d=%22M3 11l3-3 2 2 5-5%22 stroke=%22%23d4d67d%22 stroke-width=%221.8%22 fill=%22none%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/principal.css">
<link rel="stylesheet" href="/static/mobile.css">
</head>
<body class="portal">
<header class="pbar">
  <span class="mark" aria-hidden="true"></span>
  <div class="ptitle"><b id="t-portal">Portal Principal</b><span id="who"></span></div>
  <div class="zoom-ctrl" role="group" aria-label="Ukuran tampilan / Display size">
    <button type="button" id="zoom-dec" class="zoom-btn" title="Kecilkan ukuran web (A−)" aria-label="Kecilkan ukuran">A−</button>
    <button type="button" id="zoom-val" class="zoom-val" title="Atur ulang ukuran (100%)" aria-label="Atur ulang ukuran">100%</button>
    <button type="button" id="zoom-inc" class="zoom-btn" title="Besarkan ukuran web (A+)" aria-label="Besarkan ukuran">A+</button>
  </div>
  <button type="button" id="helpbtn" class="pbtn small">Bantuan</button>
  <div class="lang" role="group" aria-label="Bahasa / Language">
    <button type="button" data-lang="id" aria-pressed="true">ID</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
</header>
<main id="app" class="pmain"><p class="muted">Memuat… / Loading…</p></main>
<dialog id="dlg" class="pdlg"><div id="dlg-body"></div></dialog>
<div id="ptoast" class="ptoast" role="status" hidden></div>
<button type="button" id="aibtn" class="aifab" aria-expanded="false" aria-controls="aipanel" aria-label="Ask AI Assistant" title="Ask AI Assistant"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path></svg></button>
<section id="aipanel" class="aipanel" role="dialog" aria-label="AI" hidden>
  <header><b id="ai-title">Asisten</b><button type="button" id="ai-close" class="pbtn small ghost" aria-label="Tutup">×</button></header>
  <div id="ai-log" class="ailog" aria-live="polite"></div>
  <form id="ai-form" class="aiform"><input id="ai-input" autocomplete="off" maxlength="500"><button type="submit" class="pbtn primary small" id="ai-send">Kirim</button></form>
</section>
<script src="/static/principal.js"></script>
</body>
</html>
